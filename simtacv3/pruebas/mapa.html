<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/colors.css">
  <link rel="stylesheet" href="/vendor/ol/ol.css">
  <style>html,body,#map-container { margin: 0; width: 100%; height: 100%; }</style>
  <script src="/vendor/ol/ol.js"></script>
  <script src="/vendor/milsymbol/milsymbol.js"></script>
  <script src="/vendor/socket.io/socket.io.js"></script>
</head>
<body><div id="map-container"></div><script type="module">
import Config from '/config.js';
import { sincronizarBase } from '/api.js';
import Session from '/session.js';
import Store from '/store.js';
import Socket from '/socket.js';
import Mapa from '/mapa.js';
import Movimiento from '/movimiento.js';
await Config.cargar();
sincronizarBase();
const actor = Number(new URLSearchParams(location.search).get('actor')) === 6 ? 6 : 5;
Session.setSesion({ token: `isolated-test-${actor}`, usuario: { id: actor, rol: 'administrador' } });
const socket = Socket.conectar();
await new Promise(resolve => socket.connected ? resolve() : socket.once('connect', resolve));
Mapa.init();
Movimiento.init();
Socket.on('ejercicio:estado_inicial', state => Store.reemplazarEstado(state));
await Socket.unirse(1);
window.harness = { Store, Socket, Mapa, Movimiento,
  routes: () => Mapa.instancia().getLayers().getArray().find(layer => layer.get('title') === 'Trayectos').getSource().getFeatures(),
  marker: () => Mapa.instancia().getLayers().getArray().find(layer => layer.get('title') === 'Entidades').getSource().getFeatureById('unidad:1').getGeometry().getCoordinates(),
};
</script></body></html>
