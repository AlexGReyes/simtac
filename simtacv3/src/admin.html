<!-- Admin Section (solo visible para administradores) -->
<div id="admin-modal" class="admin-modal">
  <div class="admin-header">
    <h2 class="admin-title">⚙️ ADMINISTRACIÓN DEL SISTEMA</h2>
    <button id="admin-close-btn" class="admin-close-btn">✕</button>
  </div>

  <div class="admin-container">
    <!-- Navegación de Tablas -->
    <div class="admin-nav">
      <button class="admin-tab-btn active" data-table="usuarios">👤 Usuarios</button>
      <button class="admin-tab-btn" data-table="unidades-base">🎖️ Plantillas</button>
      <button class="admin-tab-btn" data-table="unidades">🚁 Unidades</button>
      <button class="admin-tab-btn" data-table="ejercicios">🎯 Ejercicios</button>
      <button class="admin-tab-btn" data-table="asignaciones">🔗 Asignaciones</button>
      <button class="admin-tab-btn" data-table="participantes">👥 Participantes</button>
    </div>

    <!-- Contenido de Tablas -->
    <div class="admin-content">
      <!-- USUARIOS -->
      <div class="admin-table-view active" data-table="usuarios">
        <div class="admin-filter-bar">
          <input type="text" id="usuarios-filter" class="admin-filter-input" placeholder="🔍 Buscar usuario, nombre o grado...">
          <select id="usuarios-rol-filter" class="admin-filter-select">
            <option value="">Todos los roles</option>
            <option value="usuario">👤 Usuario</option>
            <option value="administrador">👑 Administrador</option>
          </select>
        </div>
        <div class="admin-actions">
          <button id="usuarios-new-btn" class="admin-new-btn">+ Nuevo Usuario</button>
        </div>
        <table id="usuarios-table" class="admin-data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuario</th>
              <th>Nombre</th>
              <th>Grado</th>
              <th>Rol</th>
              <th>Creado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- UNIDADES BASE -->
      <div class="admin-table-view" data-table="unidades-base">
        <div class="admin-filter-bar">
          <input type="text" id="unidades-base-filter" class="admin-filter-input" placeholder="🔍 Buscar SIDC o nombre de plantilla...">
          <input type="text" id="unidades-base-tipo-filter" class="admin-filter-input" placeholder="Filtrar por tipo...">
          <input type="text" id="unidades-base-pais-filter" class="admin-filter-input" placeholder="Filtrar por país...">
        </div>
        <div class="admin-actions">
          <button id="unidades-base-new-btn" class="admin-new-btn">+ Nueva Plantilla</button>
        </div>
        <table id="unidades-base-table" class="admin-data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>SIDC</th>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>País</th>
              <th>Creado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- UNIDADES MILITARES -->
      <div class="admin-table-view" data-table="unidades">
        <div class="admin-filter-bar">
          <input type="text" id="unidades-filter" class="admin-filter-input" placeholder="🔍 Buscar por nombre de unidad...">
          <input type="text" id="unidades-tipo-filter" class="admin-filter-input" placeholder="Filtrar por tipo...">
          <input type="text" id="unidades-sidc-filter" class="admin-filter-input" placeholder="Filtrar por SIDC...">
        </div>
        <div class="admin-actions">
          <button id="unidades-new-btn" class="admin-new-btn">+ Nueva Unidad</button>
        </div>
        <table id="unidades-table" class="admin-data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Plantilla SIDC</th>
              <th>Tipo</th>
              <th>Posición X</th>
              <th>Posición Y</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- EJERCICIOS -->
      <div class="admin-table-view" data-table="ejercicios">
        <div class="admin-filter-bar">
          <input type="text" id="ejercicios-filter" class="admin-filter-input" placeholder="🔍 Buscar por nombre o sala...">
          <select id="ejercicios-estado-filter" class="admin-filter-select">
            <option value="">Todos los estados</option>
            <option value="true">✓ Activos</option>
            <option value="false">✗ Inactivos</option>
          </select>
        </div>
        <div class="admin-actions">
          <button id="ejercicios-new-btn" class="admin-new-btn">+ Nuevo Ejercicio</button>
        </div>
        <table id="ejercicios-table" class="admin-data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Sala</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- ASIGNACIONES -->
      <div class="admin-table-view" data-table="asignaciones">
        <div class="admin-filter-bar">
          <input type="text" id="asignaciones-filter" class="admin-filter-input" placeholder="🔍 Buscar por usuario o unidad...">
        </div>
        <div class="admin-actions">
          <button id="asignaciones-new-btn" class="admin-new-btn">+ Nueva Asignación</button>
        </div>
        <table id="asignaciones-table" class="admin-data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuario</th>
              <th>Unidad</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- PARTICIPANTES -->
      <div class="admin-table-view" data-table="participantes">
        <div class="admin-filter-bar">
          <input type="text" id="participantes-filter" class="admin-filter-input" placeholder="🔍 Buscar por usuario o ejercicio...">
          <input type="text" id="participantes-bando-filter" class="admin-filter-input" placeholder="Filtrar por bando...">
        </div>
        <div class="admin-actions">
          <button id="participantes-new-btn" class="admin-new-btn">+ Nuevo Participante</button>
        </div>
        <table id="participantes-table" class="admin-data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Ejercicio</th>
              <th>Usuario</th>
              <th>Bando</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Formulario -->
<div id="admin-form-modal" class="admin-form-modal">
  <div class="admin-form-content">
    <div class="admin-form-header">
      <h3 id="admin-form-title"></h3>
      <button id="admin-form-close-btn" class="admin-form-close">✕</button>
    </div>
    <form id="admin-form">
      <div id="admin-form-fields"></div>
      <div class="admin-form-actions">
        <button type="submit" class="admin-submit-btn">Guardar</button>
        <button type="button" id="admin-form-cancel-btn" class="admin-cancel-btn">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Overlay -->
<div id="admin-form-overlay" class="admin-form-overlay"></div>
